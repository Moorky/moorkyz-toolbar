name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/deploy-coolify.test.cjs tests/tooling/moorkyz-runtime.node.cjs
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check
      - run: pnpm test:directory-cleaner:browser
      - run: pnpm check:source
      - run: pnpm audit --audit-level=low
      - run: pnpm licenses list --json

  container:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --pull --tag moorkyz-tools:${{ github.sha }} .
      - name: Smoke-test production container
        shell: bash
        env:
          IMAGE_TAG: moorkyz-tools:${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'docker rm --force ci-app >/dev/null 2>&1 || true' EXIT
          docker run --detach --name ci-app --publish 127.0.0.1::3000 "$IMAGE_TAG"
          published_port="$(docker port ci-app 3000/tcp | sed 's/.*://')"
          test -n "$published_port"
          for attempt in {1..45}; do
            if curl --fail --silent --max-time 3 "http://127.0.0.1:$published_port/" >/dev/null \
              && curl --fail --silent --max-time 3 "http://127.0.0.1:$published_port/" >/dev/null; then
              echo "Production health and root page passed."
              exit 0
            fi
            sleep 2
          done
          docker logs ci-app
          exit 1

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: [verify, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production
    timeout-minutes: 25
    concurrency:
      group: moorkyz-tools-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Skip stale production commits
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const response = await fetch(process.env.GITHUB_API_URL + '/repos/' + process.env.GITHUB_REPOSITORY + '/git/ref/heads/master', {
            headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json' },
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error('Cannot verify production branch head: HTTP ' + response.status);
          const ref = await response.json();
          const current = ref.object?.sha === process.env.GITHUB_SHA;
          appendFileSync(process.env.GITHUB_OUTPUT, 'current=' + current + '\n');
          if (!current) console.log('A newer production commit exists; skipping this deployment.');
          NODE
      - name: Deploy, wait for completion and check public health
        if: steps.head.outputs.current == 'true'
        env:
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
          COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL || 'https://tools.moorkyz.com/' }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/deploy-coolify.cjs
